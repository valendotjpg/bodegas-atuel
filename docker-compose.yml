# Etapa 1: solo la base. API y front se agregan en las etapas 6 y 7.
services:
  db:
    image: postgres:16.4
    container_name: bodegas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Los usa db/migrations/007_roles.sql para crear el rol de la API.
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      # Los usa db/migrations/007_roles.sql para crear el rol de reportes.
      REPORT_DB_USER: ${REPORT_DB_USER}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Los .sql de esta carpeta corren en orden alfabetico (001, 002, ...)
      # solo la PRIMERA vez que se crea el volumen. Si una falla, la init se
      # corta y hay que recrear el volumen (docker compose down -v).
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Carga masiva (etapa 3). No arranca con "up": se corre a mano sobre una base vacia con
  #   docker compose run --rm seed
  # Usa el usuario duenio porque desactiva los triggers durante la carga.
  seed:
    image: python:3.12-slim
    profiles: ["seed"]
    working_dir: /seed
    volumes:
      - ./db/seed:/seed:ro
    environment:
      DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command: sh -c 'pip install -q "psycopg[binary]" Faker && python generar.py --dsn "$$DSN"'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
